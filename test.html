<!DOCTYPE html>
<html>
<head>
    <title>Test 1 - Simple</title>
</head>
<body>
    <h1 style="color:blue;">🔵 Test 1: Simple HTML</h1>
    <button onclick="alert('✅ Button works!')" style="padding:20px;font-size:20px;background:green;color:white;border:none;border-radius:10px;">
        Click Me

    <p id="msg" style="font-size:18px;margin-top:20px;"></p>

        document.getElementById('msg').innerHTML = '✅ Page loaded successfully!';
        alert('✅ Page loaded!');
    </script>
</body>
</html>
