<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teach Hub - Student</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; height: 100vh; background: #f5f7f8; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #1B4F72; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #eef2f5; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 14px; word-wrap: break-word; }
        .msg.user { background: #d6e8f5; align-self: flex-end; border-top-right-radius: 0; }
        .msg.admin { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; border: 1px solid #ddd; }
        .msg img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .msg video { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; }
        .msg audio { max-width: 100%; margin-top: 5px; }
        .msg .time { font-size: 10px; color: #888; margin-top: 4px; display: block; text-align: right; }
        .chat-input-area { padding: 10px; background: #e4e9ec; display: flex; align-items: center; gap: 8px; }
        .input-container { flex: 1; background: #fff; border-radius: 24px; display: flex; align-items: center; padding: 2px 12px; }
        .input-container input { flex: 1; border: none; outline: none; padding: 10px 4px; font-size: 15px; background: transparent; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #54656f; }
        .send-btn { background: #1B4F72; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .file-input { display: none; }
        .preview { max-width: 100px; max-height: 100px; border-radius: 8px; margin: 5px; }
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">💬 Teach Hub Support</div>
    <div class="chat-messages" id="chatBox"></div>

    <div class="chat-input-area">
        <div class="input-container">
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="file" id="fileInput" class="file-input" accept="image/*,video/*,audio/*" onchange="handleFile(event)">
            <input type="text" id="msgInput" placeholder="Type a message...">
            <button class="icon-btn" id="voiceBtn" onclick="toggleRecording()">🎙️</button>
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">✕</span>
    <img id="lightboxImg" src="">
</div>

<script>
// ==========================================
// 🔥 FIREBASE CONFIG (Apna config paste karo)
// ==========================================
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ==========================================
// 🔥 IMGBB API KEY
// ==========================================
const IMG_BB_KEY = 'c10f07a29b678cda424ef81b2e5f2302';

// ==========================================
// 🔥 CHAT ID
// ==========================================
const CHAT_ID = localStorage.getItem('chat_id') || 'user_' + Date.now();
localStorage.setItem('chat_id', CHAT_ID);

// ==========================================
// 🔥 SEND MESSAGE
// ==========================================
function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    
    if (!text) return;
    input.value = '';
    
    const msg = {
        sender: 'user',
        type: 'text',
        text: text,
        time: Date.now()
    };
    
    database.ref('chats/' + CHAT_ID + '/messages').push(msg);
}

// ==========================================
// 🔥 HANDLE FILE UPLOAD
// ==========================================
async function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    if (file.size > 1572864) {
        alert('File size must be under 1.5MB');
        event.target.value = '';
        return;
    }
    
    const type = file.type.startsWith('image/') ? 'image' : 
                 file.type.startsWith('video/') ? 'video' : 'audio';
    
    const formData = new FormData();
    formData.append('image', file);
    
    try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_KEY}`, {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        if (data.success) {
            const msg = {
                sender: 'user',
                type: type,
                file_url: data.data.url,
                text: `Sent a ${type}`,
                time: Date.now()
            };
            database.ref('chats/' + CHAT_ID + '/messages').push(msg);
        } else {
            alert('Upload failed!');
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
    
    event.target.value = '';
}

// ==========================================
// 🔥 RECEIVE MESSAGES (Real-time)
// ==========================================
function loadMessages() {
    const chatBox = document.getElementById('chatBox');
    
    database.ref('chats/' + CHAT_ID + '/messages')
        .orderByChild('time')
        .on('child_added', function(snapshot) {
            const msg = snapshot.val();
            renderMessage(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
}

// ==========================================
// 🔥 RENDER MESSAGE
// ==========================================
function renderMessage(msg) {
    const chatBox = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = 'msg ' + (msg.sender === 'user' ? 'user' : 'admin');
    
    let content = '';
    
    if (msg.type === 'text') {
        content = msg.text;
    } else if (msg.type === 'image') {
        content = `<img src="${msg.file_url}" onclick="openLightbox('${msg.file_url}')">`;
    } else if (msg.type === 'video') {
        content = `<video src="${msg.file_url}" controls></video>`;
    } else if (msg.type === 'audio') {
        content = `<audio src="${msg.file_url}" controls></audio>`;
    }
    
    const time = new Date(msg.time).toLocaleTimeString();
    div.innerHTML = content + `<span class="time">${time}</span>`;
    chatBox.appendChild(div);
}

// ==========================================
// 🔥 LIGHTBOX
// ==========================================
function openLightbox(url) {
    document.getElementById('lightbox').style.display = 'flex';
    document.getElementById('lightboxImg').src = url;
}

function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}

// ==========================================
// 🔥 VOICE RECORDING
// ==========================================
let mediaRecorder, audioChunks = [], isRecording = false;

async function toggleRecording() {
    const btn = document.getElementById('voiceBtn');
    
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                const formData = new FormData();
                formData.append('image', blob);
                
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    const msg = {
                        sender: 'user',
                        type: 'audio',
                        file_url: data.data.url,
                        text: 'Sent a voice note',
                        time: Date.now()
                    };
                    database.ref('chats/' + CHAT_ID + '/messages').push(msg);
                }
            };
            
            mediaRecorder.start();
            isRecording = true;
            btn.textContent = '🛑';
            btn.style.color = 'red';
        } catch (e) {
            alert('Microphone access denied');
        }
    } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.textContent = '🎙️';
        btn.style.color = '#54656f';
    }
}

// ==========================================
// 🔥 ENTER KEY
// ==========================================
document.getElementById('msgInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
});

// ==========================================
// 🔥 START
// ==========================================
loadMessages();
alert('✅ Chat Started! ID: ' + CHAT_ID);
</script>
</body>
</html>
