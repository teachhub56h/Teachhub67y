async function uploadMediaToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {

    });

// ==========================================
// 🔥 FIX: recorded voice notes must never pass through WebM/MediaRecorder,
// which has a well-known browser bug that corrupts the saved duration.
// Instead, raw audio samples are captured directly via the Web Audio API
// as they're recorded, and the WAV file is built from them ourselves -
// a WAV built this way always has a correct, accurate duration.
// ==========================================
let recordCtx, recordSource, recordProcessor, recordedChunks, recordSampleRate, recordStream;

async function startRawRecording() {
    recordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordCtx = new (window.AudioContext || window.webkitAudioContext)();
    recordSampleRate = recordCtx.sampleRate;
    recordSource = recordCtx.createMediaStreamSource(recordStream);
    recordProcessor = recordCtx.createScriptProcessor(4096, 1, 1);
    recordedChunks = [];

    recordProcessor.onaudioprocess = (e) => {
        recordedChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };

    const silentGain = recordCtx.createGain();
    silentGain.gain.value = 0;
    recordSource.connect(recordProcessor);
    recordProcessor.connect(silentGain);
    silentGain.connect(recordCtx.destination);
}

function stopRawRecording() {
    recordProcessor.disconnect();
    recordSource.disconnect();
    recordStream.getTracks().forEach(t => t.stop());

    let totalLength = 0;
    for (const chunk of recordedChunks) totalLength += chunk.length;
    const merged = new Float32Array(totalLength);
    let offset = 0;
    for (const chunk of recordedChunks) { merged.set(chunk, offset); offset += chunk.length; }

    recordCtx.close();
    return encodeWAV(merged, recordSampleRate);
}

function encodeWAV(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);
    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(view, 36, 'data');
    view.setUint32(40, samples.length * 2, true);
    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([view], { type: 'audio/wav' });
}

function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
}

// Keeps only the latest MAX_MESSAGES_PER_CHAT messages.
async function trimMessages(chatId, maxCount) {
    try {
        const snap = await db.ref('chats/' + chatId + '/messages').once('value');
        const total = snap.numChildren();
        if (total > maxCount) {
            const excess = total - maxCount;
            const oldestSnap = await db.ref('chats/' + chatId + '/messages')
                .orderByChild('time_now')
                .limitToFirst(excess)
                .once('value');
            const updates = {};
            oldestSnap.forEach(child => { updates[child.key] = null; });
            await db.ref('chats/' + chatId + '/messages').update(updates);
            await db.ref('chatSummary/' + chatId + '/msgCount').transaction(c => Math.max((c || 0) - excess, 0));
        }
    } catch (e) {
        console.error('trimMessages error:', e);
    }
}

async function checkStaleUsers() {
    try {
        const snap = await db.ref('chatSummary').once('value');
        const summaries = snap.val();
        if (!summaries) return;
        const now = Date.now();
        for (const [docId, docData] of Object.entries(summaries)) {
            const last = docData.lastUpdated || 0;
            if (now - last > INACTIVITY_LIMIT_MS) {
                // FIX: re-check this one user fresh, right before deleting.
                // The list above was a snapshot from a moment ago - if the
                // user sent a new message in the meantime, this catches
                // that and skips the delete instead of wiping their brand
                // new message out from under them.
                const freshSnap = await db.ref('chatSummary/' + docId + '/lastUpdated').once('value');
                const freshLast = freshSnap.val() || 0;
                if (Date.now() - freshLast > INACTIVITY_LIMIT_MS) {
                    await deleteUserCompletely(docId, getUserFriendlyName(docId));
                }
            }
        }
    } catch (e) {
        console.error('checkStaleUsers error:', e);
    }
}

// ==========================================
// 🔥 PRIVACY TOGGLE
// Lets the admin turn off sharing their own online/typing/recording
// status with students at any time. When off, nothing about the admin's
// activity is written anywhere a student could see it.
// ==========================================
function loadPrivacySetting() {
    db.ref('adminSettings/showPresence').on('value', (snap) => {
        showPresenceToAdmin = snap.val() !== false; // default true
        privacyToggleBtn.textContent = showPresenceToAdmin ? '👁 Status: ON' : '🙈 Status: OFF';
        privacyToggleBtn.classList.toggle('off', !showPresenceToAdmin);
        if (!showPresenceToAdmin && activeDocId) {
            // Immediately clear anything currently visible to the student.
            db.ref('chats/' + activeDocId + '/presence/adminOnline').set(false);
            db.ref('chats/' + activeDocId + '/presence/adminTyping').set(false);
            db.ref('chats/' + activeDocId + '/presence/adminRecording').set(false);
        } else if (showPresenceToAdmin && activeDocId) {
            db.ref('chats/' + activeDocId + '/presence/adminOnline').set(true);
            db.ref('chats/' + activeDocId + '/presence/adminOnline').onDisconnect().set(false);
        }
    });
}

window.togglePrivacy = function() {

// ==========================================
// 🔥 USER NAME GENERATOR
// ==========================================
function getUserFriendlyName(docId) {
    let savedNames = localStorage.getItem('chatUserNames');
    savedNames = savedNames ? JSON.parse(savedNames) : {};
    if (savedNames[docId]) return savedNames[docId];

    const assignedNumbers = Object.values(savedNames).map(name => parseInt(name.replace("Student ", "")) || 0);
    const nextNumber = assignedNumbers.length > 0 ? Math.max(...assignedNumbers) + 1 : 1;
    const newName = "Student " + nextNumber;
    savedNames[docId] = newName;
    localStorage.setItem('chatUserNames', JSON.stringify(savedNames));
    return newName;
}

// ==========================================
// 🔥 DELETE USER (also wipes their Storage media)
// ==========================================
async function deleteUserCompletely(docId, userName) {
    try {
        await db.ref('chats/' + docId).remove();
        await db.ref('chatSummary/' + docId).remove();

        let savedNames = localStorage.getItem('chatUserNames');
        if (savedNames) {
            savedNames = JSON.parse(savedNames);
            delete savedNames[docId];
            localStorage.setItem('chatUserNames', JSON.stringify(savedNames));
        }
        return true;
    } catch (error) {
        console.error("Error:", error);
        return false;
    }
}

        await db.ref('chatSummary').remove();
        localStorage.removeItem('chatUserNames');
        alert('✅ All deleted!');
        loadInbox();
    } catch (error) {
        alert('❌ Error: ' + error.message);
    }
}

// ==========================================
// 🔥 SELECT/DESELECT
// ==========================================
function toggleUserSelection(docId, checkbox) {
    if (checkbox.checked) {
        selectedUsers.add(docId);
        document.getElementById(`user-item-${docId}`)?.classList.add('selected');
    } else {
        selectedUsers.delete(docId);
        document.getElementById(`user-item-${docId}`)?.classList.remove('selected');
    }
    deleteSelectedBtn.disabled = selectedUsers.size === 0;
    deleteSelectedBtn.textContent = selectedUsers.size > 0 ? `🗑 Delete Selected (${selectedUsers.size})` : '🗑 Delete Selected';
}

// ==========================================
// 🔥 DELETE SELECTED
// ==========================================
async function deleteSelectedUsers() {
    if (selectedUsers.size === 0) return;
    if (!confirm(`Delete ${selectedUsers.size} user(s)?`)) return;

    deleteSelectedBtn.disabled = true;
    deleteSelectedBtn.textContent = '⏳ Deleting...';

    let deleted = 0;
    const toDelete = [...selectedUsers];
    for (const docId of toDelete) {
        const userName = getUserFriendlyName(docId);
        const success = await deleteUserCompletely(docId, userName);
        if (success) deleted++;
    }

    selectedUsers.clear();
    deleteSelectedBtn.disabled = true;
    deleteSelectedBtn.textContent = '🗑 Delete Selected';
    alert(`✅ ${deleted} user(s) deleted!`);
    loadInbox();
}

// ==========================================
// 🔥 CUSTOM LISTS ("labels") - like WhatsApp Business labels.
// Hold a user for 2 seconds to open the chooser, create as many named,
// colored lists as you like, and tick any number onto that user.
// ==========================================
let allLabels = {};
let labelChooserDocId = null;
const LABEL_COLOR_PALETTE = ['#29b6d8', '#ffca28', '#fb8c00', '#ec407a', '#f6e27a', '#9e9e9e', '#26a69a', '#5c6bc0'];

function loadLabelsGlobal() {
    db.ref('labels').on('value', (snap) => {
        allLabels = snap.val() || {};
    });
}

window.openLabelChooser = function(docId) {
    labelChooserDocId = docId;
    renderLabelChooserList();
    document.getElementById('labelChooserOverlay').style.display = 'flex';
};

window.closeLabelChooser = function() {
    document.getElementById('labelChooserOverlay').style.display = 'none';
    labelChooserDocId = null;
};

async function renderLabelChooserList() {
    const container = document.getElementById('labelListContainer');
    const summarySnap = await db.ref('chatSummary/' + labelChooserDocId + '/labels').once('value');
    const currentLabels = summarySnap.val() || {};
    const ids = Object.keys(allLabels);
    if (ids.length === 0) {
        container.innerHTML = "<div style='padding:10px 0;color:#888;font-size:13px;'>No lists yet. Tap '➕ New list' to create one.</div>";
        return;
    }
    container.innerHTML = ids.map(id => {
        const lbl = allLabels[id];
        const checked = currentLabels[id] ? 'checked' : '';
        return `<label class="label-row">
            <span class="label-dot" style="background:${lbl.color}"></span>
            <span class="label-name">${lbl.name}</span>
            <input type="checkbox" ${checked} onchange="toggleUserLabel('${id}', this.checked)">
        </label>`;
    }).join('');
}

window.toggleUserLabel = function(labelId, checked) {
    if (!labelChooserDocId) return;
    db.ref('chatSummary/' + labelChooserDocId + '/labels/' + labelId).set(checked ? true : null);
};

window.createNewLabelPrompt = async function() {
    const name = prompt('Name this new list:');
    if (!name || !name.trim()) return;
    const color = LABEL_COLOR_PALETTE[Object.keys(allLabels).length % LABEL_COLOR_PALETTE.length];
    const newRef = db.ref('labels').push();
    await newRef.set({ name: name.trim(), color });
    if (labelChooserDocId) {
        await db.ref('chatSummary/' + labelChooserDocId + '/labels/' + newRef.key).set(true);
    }
    renderLabelChooserList();
};

// ==========================================
// 🔥 LONG-PRESS (hold 2 seconds) to open the list chooser for a user
// ==========================================
let longPressTimer = null;
let longPressTriggered = false;

function attachLongPress(itemDiv, docId) {
    const start = () => {
        longPressTriggered = false;
        longPressTimer = setTimeout(() => {
            longPressTriggered = true;
            openLabelChooser(docId);
        }, 2000);
    };
    const cancel = () => clearTimeout(longPressTimer);

    itemDiv.addEventListener('touchstart', start, { passive: true });
    itemDiv.addEventListener('touchend', cancel);
    itemDiv.addEventListener('touchmove', cancel);
    itemDiv.addEventListener('touchcancel', cancel);
    itemDiv.addEventListener('mousedown', start);
    itemDiv.addEventListener('mouseup', cancel);
    itemDiv.addEventListener('mouseleave', cancel);
}
    if (!confirm(`Delete "${userName}"?`)) return;
    await deleteUserCompletely(docId, userName);
    if (activeDocId === docId) goBackToInbox();
    alert(`✅ Deleted "${userName}"`);
    loadInbox();
};

// ==========================================
// 🔥 LOAD INBOX
// ==========================================
function loadInbox() {
    inboxView.style.display = 'flex';
    chatView.style.display = 'none';

    detachChatListeners(activeDocId);
    activeDocId = "";

    selectedUsers.clear();
    deleteSelectedBtn.disabled = true;
    deleteSelectedBtn.textContent = '🗑 Delete Selected';

    userListDiv.innerHTML = "<div style='padding:20px;text-align:center;color:#6b7a85;'>⏳ Loading users...</div>";

    db.ref('chatSummary').on('value', (snapshot) => {
        const chats = snapshot.val();

        if (!chats) {
            userListDiv.innerHTML = "<div style='padding:20px;text-align:center;color:#6b7a85;'>📭 No users yet. Share your link!</div>";
            return;
        }

        const sortedChats = Object.entries(chats).sort((a, b) => {
            return (b[1].lastUpdated || 0) - (a[1].lastUpdated || 0);
        });

        userListDiv.innerHTML = "";

        for (const [docId, docData] of sortedChats) {
            const userName = getUserFriendlyName(docId);
            const isSelected = selectedUsers.has(docId);
            const msgCount = docData.msgCount || 0;
            const unreadCount = docData.unreadCount || 0;

            const userLabelIds = docData.labels ? Object.keys(docData.labels).filter(id => docData.labels[id] && allLabels[id]) : [];
            const labelPillsHtml = userLabelIds.length
                ? userLabelIds.map(id => `<span class="label-pill" style="background:${allLabels[id].color}">${allLabels[id].name}</span>`).join('')
                : '<span style="font-size:11px;color:#aaa;">No list (hold 2s to add)</span>';

            const itemDiv = document.createElement('div');
            itemDiv.className = `user-item ${isSelected ? 'selected' : ''}`;
            itemDiv.id = `user-item-${docId}`;

            itemDiv.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;width:100%;">
                    <input type="checkbox" class="select-checkbox" id="checkbox-${docId}" 
                           onchange="toggleUserSelection('${docId}', this)" 
                           ${isSelected ? 'checked' : ''}>
                    <div class="user-clickable-area" onclick="window.openChat('${docId}', '${userName}')">
                        <div class="user-avatar">🎓<span class="online-dot ${docData.online ? 'online' : ''}"></span></div>
                        <div class="user-details">
                            <div class="user-phone">${userName}</div>
                            <div class="user-subtitle">${docData.lastMessageText ? docData.lastMessageText : ('ID: ' + docId.substring(0, 12) + '... | Msgs: ' + msgCount)}</div>
                        </div>
                        ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
                    </div>
                </div>
                <div class="status-container">
                    ${labelPillsHtml}
                    <button class="delete-user-btn" onclick="event.stopPropagation(); window.deleteUser('${docId}', '${userName}')">🗑 Delete</button>
                </div>
            `;
            userListDiv.appendChild(itemDiv);
            attachLongPress(itemDiv, docId);
        }
    }, (error) => {
        userListDiv.innerHTML = "<div style='padding:20px;text-align:center;color:#c62828;'>❌ Error loading users: " + error.code + " - " + error.message + "</div>";
        console.error('loadInbox permission error:', error);
    });
}

// ==========================================
// 🔥 GO BACK
// ==========================================
window.goBackToInbox = function() { loadInbox(); };

// ==========================================
// 🔥 DETACH LISTENERS (messages + presence) for a given chat id
// ==========================================
function detachChatListeners(docId) {
    if (!docId) return;
    db.ref('chats/' + docId + '/messages').off();
    db.ref('chats/' + docId + '/presence').off();
    db.ref('chats/' + docId + '/presence/adminOnline').onDisconnect().cancel();
    db.ref('chats/' + docId + '/presence/adminTyping').onDisconnect().cancel();
    db.ref('chats/' + docId + '/presence/adminRecording').onDisconnect().cancel();
    db.ref('chats/' + docId + '/presence/adminOnline').set(false);
    db.ref('chats/' + docId + '/presence/adminTyping').set(false);
    db.ref('chats/' + docId + '/presence/adminRecording').set(false);
    clearTimeout(adminTypingTimeout);
}

// ==========================================
// 🔥 OPEN CHAT
// ==========================================
window.openChat = function(docId, userName) {
    if (longPressTriggered) {
        longPressTriggered = false;
        return;
    }
    const previousDocId = activeDocId;
    if (previousDocId && previousDocId !== docId) {
        detachChatListeners(previousDocId);
    }

    activeDocId = docId;
    inboxView.style.display = 'none';
    chatView.style.display = 'flex';
    chatTitle.innerText = userName;
    chatBox.innerHTML = "";
    chatStatusLine.textContent = 'active chat session';
    chatStatusLine.classList.remove('active-indicator');

    db.ref('chatSummary/' + docId + '/unreadCount').set(0);

    detachChatListeners(docId);

    if (showPresenceToAdmin) {
        db.ref('chats/' + docId + '/presence/adminOnline').set(true);
        db.ref('chats/' + docId + '/presence/adminOnline').onDisconnect().set(false);
    }

    db.ref('chats/' + docId + '/messages')
        .orderByChild('time_now')
        .on('child_added', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.sender === 'user' && data.status !== 'read') {
                db.ref('chats/' + docId + '/messages/' + snapshot.key + '/status').set('read');
            }

            renderMessage(snapshot.key, data);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

    db.ref('chats/' + docId + '/messages')
        .on('child_removed', (snapshot) => {
            removeMessageFromUI(snapshot.key);
        });

    db.ref('chats/' + docId + '/messages')
        .on('child_changed', (snapshot) => {
            updateMessageTick(snapshot.key, snapshot.val());
        });

    db.ref('chats/' + docId + '/presence').on('value', (snapshot) => {
        const p = snapshot.val() || {};
        if (p.userRecording) {
            chatStatusLine.textContent = '🎙️ recording a voice note...';
            chatStatusLine.classList.add('active-indicator');
        } else if (p.userTyping) {
            chatStatusLine.textContent = '✍️ typing...';
            chatStatusLine.classList.add('active-indicator');
        } else if (p.userOnline) {
            chatStatusLine.textContent = '🟢 online';
            chatStatusLine.classList.remove('active-indicator');
        } else {
            chatStatusLine.textContent = 'active chat session';
            chatStatusLine.classList.remove('active-indicator');
        }
    });
};

document.addEventListener('visibilitychange', () => {
    if (!activeDocId || !showPresenceToAdmin) return;
    db.ref('chats/' + activeDocId + '/presence/adminOnline').set(document.visibilityState === 'visible');
});

// ==========================================
// 🔥 TYPING / RECORDING INDICATOR (admin -> student)
// ==========================================
msgInput.addEventListener('input', () => {
    if (!activeDocId || !showPresenceToAdmin) return;
    db.ref('chats/' + activeDocId + '/presence/adminTyping').set(true);
    db.ref('chats/' + activeDocId + '/presence/adminTyping').onDisconnect().set(false);
    clearTimeout(adminTypingTimeout);
    adminTypingTimeout = setTimeout(() => {
        db.ref('chats/' + activeDocId + '/presence/adminTyping').set(false);
    }, TYPING_TIMEOUT_MS);
});

function clearAdminTyping() {
    if (!activeDocId) return;
    clearTimeout(adminTypingTimeout);
    db.ref('chats/' + activeDocId + '/presence/adminTyping').set(false);
}

// ==========================================
// 🔥 RENDER MESSAGE
// ==========================================
function removeMessageFromUI(msgId) {
    const el = document.getElementById('msg-' + msgId);
    if (el) el.remove();
}

// ==========================================
// 🔥 CUSTOM VOICE MESSAGE PLAYER
// ==========================================
function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
}

function initVoiceMessage(container) {
    const audioEl = container.querySelector('.voice-audio-el');
    const playBtn = container.querySelector('.voice-play-btn');
    const fill = container.querySelector('.voice-progress-fill');
    const durationEl = container.querySelector('.voice-duration');
    const track = container.querySelector('.voice-progress-track');
    if (!audioEl) return;

    audioEl.addEventListener('loadedmetadata', () => {
        if (isFinite(audioEl.duration)) durationEl.textContent = formatTime(audioEl.duration);
    });
    audioEl.addEventListener('timeupdate', () => {
        if (audioEl.duration) {
            fill.style.width = (audioEl.currentTime / audioEl.duration * 100) + '%';
            durationEl.textContent = formatTime(audioEl.duration - audioEl.currentTime);
        }
    });
    audioEl.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        fill.style.width = '0%';
        durationEl.textContent = formatTime(audioEl.duration || 0);
    });
    playBtn.addEventListener('click', () => {
        if (audioEl.paused) {
            document.querySelectorAll('audio.voice-audio-el').forEach(a => { if (a !== audioEl) a.pause(); });
            audioEl.play();
            playBtn.textContent = '⏸';
        } else {
            audioEl.pause();
            playBtn.textContent = '▶';
        }
    });
    track.addEventListener('click', (e) => {
        const rect = track.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        if (audioEl.duration) audioEl.currentTime = Math.max(0, Math.min(1, ratio)) * audioEl.duration;
    });
}

function updateMessageTick(msgId, data) {
    if (!data || data.sender !== 'admin') return;
    const el = document.getElementById('msg-' + msgId);
    if (!el) return;
    let tickHtml = '';
    if (data.status === 'sent') tickHtml = '<span class="tick sent">✓</span>';
    else if (data.status === 'delivered') tickHtml = '<span class="tick delivered">✓✓</span>';
    else if (data.status === 'read') tickHtml = '<span class="tick read">✓✓</span>';
    const meta = el.querySelector('.msg-meta');
    if (meta) {
        const timeSpan = meta.querySelector('span');
        meta.innerHTML = (timeSpan ? timeSpan.outerHTML : '') + ' ' + tickHtml + ` <span class="msg-delete-btn" title="Delete for everyone" onclick="deleteMessageForEveryone('${msgId}')">🗑</span>`;
    }
}

function renderMessage(msgId, data) {
    if (!data) return;
    const msgDiv = document.createElement('div');
    msgDiv.id = 'msg-' + msgId;
    const isMe = data.sender === 'admin';
    msgDiv.classList.add('msg', isMe ? 'sent-by-me' : 'received-by-me');

    if (data.type === 'text') {
        msgDiv.innerHTML = `<span>${data.message_text}</span>`;
    } else if (data.type === 'image') {
        msgDiv.innerHTML = `<img src="${data.file_url}" onclick="openLightbox('${data.file_url}', 'image')">`;
    } else if (data.type === 'video') {
        msgDiv.innerHTML = `<video src="${data.file_url}" controls onclick="openLightbox('${data.file_url}', 'video')"></video>`;
    } else if (data.type === 'audio') {
        msgDiv.innerHTML = `
            <div class="voice-msg">
                <button class="voice-play-btn" type="button">▶</button>
                <span class="voice-icon">🎤</span>
                <div class="voice-progress-track"><div class="voice-progress-fill"></div></div>
                <span class="voice-duration">0:00</span>
                <audio class="voice-audio-el" src="${data.file_url}" preload="metadata" style="display:none;"></audio>
            </div>`;
        initVoiceMessage(msgDiv);
    }

    let tickHtml = '';
    if (isMe) {
        if (data.status === 'sent') tickHtml = '<span class="tick sent">✓</span>';
        else if (data.status === 'delivered') tickHtml = '<span class="tick delivered">✓✓</span>';
        else if (data.status === 'read') tickHtml = '<span class="tick read">✓✓</span>';
    }

    const metaDiv = document.createElement('div');
    metaDiv.classList.add('msg-meta');
    metaDiv.innerHTML = `<span>${data.time_label || ''}</span> ${tickHtml} <span class="msg-delete-btn" title="Delete for everyone" onclick="deleteMessageForEveryone('${msgId}')">🗑</span>`;
    msgDiv.appendChild(metaDiv);
    chatBox.appendChild(msgDiv);
}

// Deletes one message from the database - since both the admin panel and
// the student app listen for real-time removals, it disappears from
// BOTH screens immediately, not just this one.
window.deleteMessageForEveryone = function(msgId) {
    if (!activeDocId) return;
    if (!confirm('Delete this message for everyone?')) return;
    db.ref('chats/' + activeDocId + '/messages/' + msgId).remove()
        .then(() => {
            db.ref('chatSummary/' + activeDocId + '/msgCount').transaction(c => Math.max((c || 0) - 1, 0));
        })
        .catch((err) => alert('Could not delete: ' + err.message));
};

// ==========================================
// 🔥 LIGHTBOX
// ==========================================
function openLightbox(url, type) {
    const lightbox = document.getElementById('mediaLightbox');
    const content = document.getElementById('mediaLightboxContent');
    content.innerHTML = '';
    lightbox.style.display = 'flex';

    if (type === 'image') {
        content.innerHTML = `<img src="${url}" style="max-width:100%;max-height:100%;border-radius:6px;">`;
    } else if (type === 'video') {
        content.innerHTML = `<video src="${url}" controls autoplay style="max-width:100%;max-height:100%;border-radius:6px;"></video>`;
    }
}

document.getElementById('mediaLightboxCloseBtn').addEventListener('click', () => {
    document.getElementById('mediaLightbox').style.display = 'none';
});

document.getElementById('mediaLightbox').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
        document.getElementById('mediaLightbox').style.display = 'none';
    }
});

// ==========================================
// 🔥 SEND MESSAGE
// ==========================================
async function sendMessageToFirebase(type, content) {
    if (!activeDocId) return;
    clearAdminTyping();

    let fileUrl = '';
    let messageText = content;

    if (type === 'text') {
        messageText = content;
    } else {
        try {
            fileUrl = await uploadMediaToCloudinary(content);
        } catch (e) {
            alert('Upload failed!');
            return;
        }
        messageText = type === 'audio' ? 'Sent a voice note' : `Sent a ${type}`;
    }

    const timestamp = Date.now();
    const msgData = {
        sender: 'admin',
        type: type,
        message_text: messageText,
        file_url: fileUrl,
        time_now: timestamp,
        time_label: new Date().toLocaleTimeString(),
        status: 'sent'
    };

    await db.ref('chats/' + activeDocId + '/messages').push(msgData);
    await db.ref('chats/' + activeDocId + '/lastUpdated').set(timestamp);
    await db.ref('chatSummary/' + activeDocId).update({
        lastUpdated: timestamp,
        lastMessageText: 'You: ' + messageText,
        lastSender: 'admin'
    });
    await db.ref('chatSummary/' + activeDocId + '/msgCount').transaction(c => (c || 0) + 1);
    await trimMessages(activeDocId, MAX_MESSAGES_PER_CHAT);
}

// ==========================================
// 🔥 EVENT LISTENERS
// ==========================================
sendBtn.addEventListener('click', () => {
    const t = msgInput.value.trim();
    if (t) {
        msgInput.value = '';
        sendMessageToFirebase('text', t);
    }
});

msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        const t = msgInput.value.trim();
        if (t) {
            msgInput.value = '';
            sendMessageToFirebase('text', t);
        }
    }
});

mediaInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1548576) {
        alert('File size limit is 1.5MB.');
        e.target.value = '';
        return;
    }
    const type = file.type.startsWith('image/') ? 'image' :
                 file.type.startsWith('video/') ? 'video' : 'audio';

    await sendMessageToFirebase(type, file);
    e.target.value = '';
});

voiceBtn.addEventListener('click', async () => {
    if (!isRecording) {
        try {
            await startRawRecording();
            isRecording = true;
            voiceBtn.textContent = '🛑';
            voiceBtn.classList.add('recording');
            if (activeDocId && showPresenceToAdmin) {
                db.ref('chats/' + activeDocId + '/presence/adminRecording').set(true);
                db.ref('chats/' + activeDocId + '/presence/adminRecording').onDisconnect().set(false);
            }
        } catch (e) {
            alert('Microphone access denied');
        }
    } else {
        isRecording = false;
        voiceBtn.textContent = '🎙️';
        voiceBtn.classList.remove('recording');
        if (activeDocId) {
            db.ref('chats/' + activeDocId + '/presence/adminRecording').set(false);
        }
        const wavBlob = stopRawRecording();
        await sendMessageToFirebase('audio', wavBlob);
    }
});
